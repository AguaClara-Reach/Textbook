name: Documentation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Spanish translation catalogs
        run: |
          python scripts/lint_spanish_catalogs.py --exclude-catalog Python_Tutorial --exclude-catalog Textbook_Creation_Help
          python scripts/lint_spanish_markup.py --exclude-catalog Python_Tutorial --exclude-catalog Textbook_Creation_Help

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the English and Spanish editions
        working-directory: Textbook
        run: |
          python -m sphinx -b html . _build/site
          python -m sphinx_intl build -d locale -l es
          python -m sphinx -b html -D language=es . _build/site/es
          touch _build/site/.nojekyll

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Textbook/_build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
